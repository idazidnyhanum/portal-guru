    <script>
      (function () {
        try {
          var ownDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
          var protoDesc =
            typeof Window !== 'undefined' && Window.prototype
              ? Object.getOwnPropertyDescriptor(Window.prototype, 'fetch')
              : null;
          var activeDesc = ownDesc || protoDesc;
          if (
            activeDesc &&
            !activeDesc.writable &&
            !activeDesc.set &&
            (!ownDesc || ownDesc.configurable)
          ) {
            var currentFetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : undefined;
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (nextFetch) {
                currentFetch = nextFetch;
              },
            });
          }
        } catch (_e) {
          // ignore if environment marks window.fetch non-configurable
        }

        function isExtensionFetchError(filename, message, stack) {
          var src = String(filename || '');
          var msg = String(message || '');
          var stk = String(stack || '');
          return (
            msg.indexOf('property fetch') !== -1 &&
            (src.indexOf('chrome-extension://') === 0 || stk.indexOf('chrome-extension://') !== -1)
          );
        }

        window.addEventListener(
          'error',
          function (event) {
            var stack = event && event.error && event.error.stack ? event.error.stack : '';
            if (isExtensionFetchError(event && event.filename, event && event.message, stack)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = event && event.reason;
            var msg = reason && reason.message ? reason.message : reason;
            var stack = reason && reason.stack ? reason.stack : '';
            if (isExtensionFetchError('', msg, stack)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
